# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: MJ Barrera
description: "Hi, I'm MJ — a software developer working across Python, Flutter/Dart, and 
React. After 22 years in auto retail (the last 4 as a Product Manager 
building eCommerce tools) and a year consulting on web development & SEO, I made the leap to 
writing code full-time. I'm currently a digital nomad based in Southeast 
Asia, shipping real applications and building a B2B SEO platform (Python 
backend, React frontend). Everything below is real, shipped work. Take a look, or find me on Github & LinkedIn
using the links below."
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Software Developer <span style="color:#f58506"> Portfolio </span>
location: "USA"
resume_url: /_posts/MJ_Barrera_Resume_2026.docx
avatar_image: /img/IMG_1205 Cropped.jpg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/mike-barrera-637b84122/" # Add your linkedln handle
github: "https://github.com/mikeb1869"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


