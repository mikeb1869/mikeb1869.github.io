# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: MJ Barrera
description: "Hi, I’m MJ — a Python developer focused on tooling, data pipelines, and backend systems. After 22 years in auto retail (the last 4 as a Product Manager building eCommerce tools) and a year of web/SEO consulting, I moved into full-time software development. Most of my recent work centers on production Python engines that generate published books and other real-world tools. I’m currently a digital nomad based in Southeast Asia and building a B2B SEO platform (Python backend + React frontend). Everything below is real, shipped work."
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Software Developer <span style="color:#f58506"> Portfolio </span>
location: "USA"
resume_url: /docs/MJ_Barrera_Resume_1.pdf
avatar_image: /img/IMG_1205 Cropped.jpg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/mjbarrera06" # Add your linkedln handle
github: "https://github.com/mikeb1869"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


