# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: MJ Barrera
description: "Hi, I'm MJ — a software developer building and shipping mobile apps with 
Flutter. After 22 years in auto retail (the last 3 as a Product Manager 
building eCommerce tools) and a year consulting on SEO, I made the leap to 
writing code full-time. I am currently a digital nomad based in Southeast 
Asia, and everything below is real, shipped work — not tutorials. Take a 
look, or find me on Github & LinkedIn (or grab my Resume) using the links 
below."
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Software Developer <span style="color:#f58506"> Portfolio </span>
location: "USA"
resume_url: /docs/resume.docx
avatar_image: /img/IMG_1205 Cropped.jpg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/mike-barrera-637b84122/" # Add your linkedln handle
github: "https://github.com/mikeb1869"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


